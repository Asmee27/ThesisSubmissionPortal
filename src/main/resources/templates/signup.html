<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ThesisFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <a href="/" class="logo-link">ThesisFlow</a>
    </div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/signup" class="active">Sign Up</a>
    </div>
</nav>

<main class="form-page">
    <div class="form-container login-container">
        <div class="form-header login-header">
            <span class="badge">THESISFLOW ACCOUNT</span>
            <h1>Create Your Account</h1>
            <p>Register for secure access to the ThesisFlow workspace.</p>
        </div>

        <div class="error-message" th:if="${error}">
            <span th:text="${error}">Unable to create account.</span>
        </div>

        <form th:action="@{/signup}" method="post">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required autofocus>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="STUDENT" required checked>
                        <span class="role-card">
                            <span class="role-icon">Student</span>
                            <span class="role-content"><strong>Student</strong><small>Submit and track thesis</small></span>
                        </span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="REVIEWER" required>
                        <span class="role-card">
                            <span class="role-icon">Reviewer</span>
                            <span class="role-content"><strong>Reviewer</strong><small>Review submissions</small></span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="form-group" id="studentIdGroup">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required>
            </div>

            <div class="form-group" id="registrationCodeGroup" hidden>
                <label for="registrationCode">Reviewer Registration Code</label>
                <input type="password" id="registrationCode" name="registrationCode" placeholder="Enter the registration code">
            </div>

            <button type="submit" class="submit-btn login-button">Create Account</button>
        </form>

        <p class="form-link">Already registered? <a href="/login">Sign in</a></p>
    </div>
</main>

<footer class="footer">
    <p>ThesisFlow - Thesis Submission &amp; Review Portal</p>
</footer>

<script>
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const studentIdGroup = document.getElementById('studentIdGroup');
    const studentIdInput = document.getElementById('studentId');
    const registrationCodeGroup = document.getElementById('registrationCodeGroup');
    const registrationCodeInput = document.getElementById('registrationCode');

    function updateRoleFields() {
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        const isStudent = selectedRole === 'STUDENT';
        studentIdGroup.hidden = !isStudent;
        studentIdInput.required = isStudent;
        registrationCodeGroup.hidden = isStudent;
        registrationCodeInput.required = !isStudent;
    }

    roleInputs.forEach((input) => input.addEventListener('change', updateRoleFields));
    updateRoleFields();
</script>

</body>
</html>
