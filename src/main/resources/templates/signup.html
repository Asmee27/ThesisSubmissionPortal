<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ThesisFlow</title>

    <!-- Google Fonts: Plus Jakarta Sans & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">
    <div class="logo">
        <a href="/" style="text-decoration: none; color: inherit;">
            <span class="logo-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                    <path d="M2 12h20"></path>
                </svg>
            </span>
            <span>Thesis<span class="logo-accent">Flow</span></span>
        </a>
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/signup" class="active">Sign Up</a>
    </div>
</nav>

<!-- ================= SIGNUP PAGE ================= -->

<main class="form-page">
    <div class="form-container login-container" style="max-width: 580px;">
        <div class="form-header login-header">
            <span class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                SCHOLAR REGISTRATION
            </span>
            <h1>Create Your Account</h1>
            <p>Register for secure access to the ThesisFlow academic workspace.</p>
        </div>

        <div class="error-message" th:if="${error}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}">Unable to create account.</span>
        </div>

        <form th:action="@{/signup}" method="post">

            <!-- ROLE SELECTION -->
            <div class="form-group">
                <label>Register As</label>
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="role" value="STUDENT" required checked>
                        <span class="role-card">
                            <span class="role-icon">🎓</span>
                            <span class="role-content">
                                <strong>Student</strong>
                                <small>Submit and track thesis</small>
                            </span>
                        </span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="REVIEWER" required>
                        <span class="role-card">
                            <span class="role-icon">👨‍🏫</span>
                            <span class="role-content">
                                <strong>Reviewer</strong>
                                <small>Review submissions</small>
                            </span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full legal name" required autofocus>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a unique username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
            </div>

            <div class="form-group" id="studentIdGroup">
                <label for="studentId">Student ID / Roll No</label>
                <input type="text" id="studentId" name="studentId" placeholder="e.g. 24102C2003" required>
            </div>

            <div class="form-group" id="registrationCodeGroup" hidden>
                <label for="registrationCode">Faculty Reviewer Registration Code</label>
                <input type="password" id="registrationCode" name="registrationCode" placeholder="Enter the faculty access code">
            </div>

            <button type="submit" class="submit-btn login-button">
                <span>Complete Registration</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <p class="form-link" style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700;">Sign in</a>
        </p>
    </div>
</main>

<!-- ================= FOOTER ================= -->

<footer>
    <div class="footer-logo">
        <span class="logo-badge" style="width: 28px; height: 28px; border-radius: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                <path d="M2 12h20"></path>
            </svg>
        </span>
        <span>Thesis<span class="logo-accent">Flow</span></span>
    </div>

    <p>
        Academic Thesis Submission & Review Portal
    </p>

    <p class="copyright">
        © 2026 ThesisFlow. All rights reserved.
    </p>
</footer>

<script>
    const roleInputs = document.querySelectorAll('input[name="role"]');
    const studentIdGroup = document.getElementById('studentIdGroup');
    const studentIdInput = document.getElementById('studentId');
    const registrationCodeGroup = document.getElementById('registrationCodeGroup');
    const registrationCodeInput = document.getElementById('registrationCode');

    function updateRoleFields() {
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        const isStudent = selectedRole === 'STUDENT';
        studentIdGroup.hidden = !isStudent;
        studentIdInput.required = isStudent;
        registrationCodeGroup.hidden = isStudent;
        registrationCodeInput.required = !isStudent;
    }

    roleInputs.forEach((input) => input.addEventListener('change', updateRoleFields));
    updateRoleFields();
</script>

</body>
</html>
